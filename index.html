<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Jogo de Juros e Compras - v0.1</title>
        <link rel="stylesheet" href="css/estilo.css">
        <script defer src="js/action.js"></script>
    </head>
    
    <body>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Alternar para tema escuro">
            Tema escuro
        </button>

        <div class="container">
            <h1>Jogo de Compras e Juros</h1>
            <div class="status-bar">
                <div class="stat lives-stat" id="lives" aria-label="Vidas: 3"></div>
                <span class="stat" id="score">Pontos: 0</span>
            </div>
            <div class="question" id="question"></div>
            <div class="options" id="options"></div>
            <div class="feedback" id="feedback"></div>
        </div>
    </body>
</html>
